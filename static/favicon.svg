<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#18181A" />
            <stop offset="100%" stop-color="#0A0A0B" />
        </linearGradient>
        <linearGradient id="akaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="100%" stop-color="#D4D4D8" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
        </filter>
    </defs>
    <!-- Background rounded squircle -->
    <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
    <rect width="510" height="510" x="1" y="1" rx="111" stroke="#27272A" stroke-width="2"/>
    
    <!-- AKA Monogram -->
    <g filter="url(#glow)">
        <!-- First A -->
        <path d="M76 376 L148 136 H188 L260 376 H216 L198 316 H138 L120 376 H76 Z M148 276 H188 L168 200 Z" fill="url(#akaGrad)"/>
        
        <!-- Center K (interlocking/modern bold) -->
        <path d="M246 136 H286 V240 L346 136 H396 L324 252 L402 376 H350 L286 270 V376 H246 Z" fill="url(#akaGrad)"/>
        
        <!-- Second A (overlapped right accent) -->
        <path d="M336 376 L408 136 H448 L520 376 H476 L458 316 H398 L380 376 H336 Z M408 276 H448 L428 200 Z" fill="url(#akaGrad)" opacity="0.3" clip-path="url(#rightClip)"/>
    </g>

    <!-- Clean geometric AKA typographic mark -->
    <g fill="url(#akaGrad)" text-anchor="middle">
        <text x="256" y="320" font-family="'Outfit', 'Questrial', 'Montserrat', -apple-system, sans-serif" font-weight="900" font-size="160" letter-spacing="12">AKA</text>
    </g>
    
    <!-- Accent line below AKA -->
    <rect x="146" y="348" width="220" height="6" rx="3" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="256" cy="351" r="5" fill="#FFFFFF"/>
</svg>
